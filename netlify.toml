# DRAFT ONLY. No Netlify target selected; do not deploy without explicit approval.
# This configuration stays at prototype root; only public/ is deployable.
[build]
  publish = "public"
  # Skip ordinary automatic builds; NOT a deployment/privacy lock (hooks can bypass).
  ignore = "exit 0"

[build.processing.html]
  pretty_urls = true

# Headers are global, NOT scoped by deploy context. Remove staging blocks only
# through an approved production release. noindex is not authentication.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Do not expose local handoff documentation/check tooling if later deployed.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/validate.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/validation-results.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/draft-manifest.json"
  to = "/404.html"
  status = 404
  force = true
# No SPA catch-all. Netlify serves 404.html for unknown static paths.
